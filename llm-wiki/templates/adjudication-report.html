<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>治理裁决报告 — LLM Wiki</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e2e5ea; --ink:#1f2329; --dim:#6b7280;
          --red:#c0392b; --red-bg:#fdecea; --green:#1e7e34; --green-bg:#e6f4ea;
          --amber:#9a6a00; --amber-bg:#fff4d6; --blue:#1a5fb4; --blue-bg:#e8f0fe; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px;
           display:flex; gap:24px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .stat { color:var(--dim); } header .stat b { color:var(--ink); }
  .layout { display:flex; min-height:calc(100vh - 53px); }
  nav { width:300px; border-right:1px solid var(--line); background:var(--card); padding:12px; }
  nav h2 { font-size:12px; color:var(--dim); text-transform:uppercase; margin:8px 4px; }
  .cand { display:block; width:100%; text-align:left; background:none; border:1px solid var(--line);
          border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .cand:hover { border-color:var(--blue); }
  .cand.active { border-color:var(--blue); background:var(--blue-bg); }
  .cand .t { font-weight:600; display:block; }
  .chip { display:inline-block; font-size:11px; border-radius:10px; padding:1px 8px; margin-top:4px; }
  .chip.conflict { background:var(--red-bg); color:var(--red); }
  .chip.dup { background:var(--amber-bg); color:var(--amber); }
  .chip.syn { background:var(--blue-bg); color:var(--blue); }
  main { flex:1; padding:20px 24px; max-width:980px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px 20px; margin-bottom:16px; }
  .review-note { border-left:4px solid var(--red); background:var(--red-bg); }
  .review-note h3, .card h3 { margin:0 0 8px; font-size:13px; color:var(--dim);
          text-transform:uppercase; letter-spacing:.04em; }
  .review-note .why { font-size:15px; font-weight:600; color:var(--red); }
  .diff { font:12.5px/1.5 ui-monospace,Consolas,monospace; border:1px solid var(--line);
          border-radius:8px; overflow:hidden; }
  .diff .h { background:#eef1f5; padding:4px 10px; color:var(--dim); }
  .diff div.l { padding:2px 10px; white-space:pre-wrap; }
  .diff .del { background:var(--red-bg); color:var(--red); }
  .diff .add { background:var(--green-bg); color:var(--green); }
  details { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:6px 0; }
  summary { cursor:pointer; font-weight:600; }
  .loser-pick label { display:block; border:1px solid var(--line); border-radius:8px;
          padding:10px 12px; margin:6px 0; cursor:pointer; }
  .loser-pick input { margin-right:8px; }
  .hist { color:var(--dim); font-size:13px; }
  .hist li { margin:4px 0; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .actions button { border:1px solid var(--line); background:var(--card); border-radius:8px;
          padding:8px 14px; cursor:pointer; font-size:13px; }
  .actions button:hover { border-color:var(--blue); }
  textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px;
             font:inherit; margin-top:8px; }
  .reply-out { background:#0f1115; color:#c9f2c9; border-radius:8px; padding:12px;
               font:12.5px ui-monospace,Consolas,monospace; white-space:pre-wrap; }
  .hint { color:var(--dim); font-size:12.5px; }
</style>
</head>
<body>

<header>
  <h1>🗳️ 治理裁决报告</h1>
  <span class="stat">run: <b id="st-run"></b></span>
  <span class="stat">本轮自动生效: <b id="st-auto"></b> 页</span>
  <span class="stat">待你裁决: <b id="st-pending"></b> 项</span>
  <span class="stat">人类清单(仅告知): <span id="st-human"></span></span>
</header>

<div class="layout">
<nav>
  <h2>待裁决队列</h2>
  <div id="queue"></div>
  <h2 id="auto-h2">已自动生效</h2>
  <p class="hint" id="auto-summary" style="padding:0 4px"></p>
</nav>

<main id="panel"></main>
</div>

<script id="data" type="application/json">{{DATA}}</script>
<script>
// 安全模型(§6):全部动态内容经 textContent / createTextNode 注入;本脚本永不把
// 不可信数据拼进 innerHTML。数据在构建期内嵌(下方 JSON 数据岛),无运行时加载。
const DATA = JSON.parse(document.getElementById('data').textContent);
const CASES = DATA.cases;
const CIRC = ['①','②','③','④','⑤'];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

document.getElementById('st-run').textContent = DATA.generatedAt;
document.getElementById('st-auto').textContent = String(DATA.autoApproved);
document.getElementById('st-pending').textContent = String(CASES.length);
document.getElementById('st-human').textContent = DATA.humanSummary;
document.getElementById('auto-h2').textContent = '已自动生效(' + DATA.autoApproved + ')';
document.getElementById('auto-summary').textContent = DATA.autoSummary;

let current = 0;
const queue = document.getElementById('queue');
CASES.forEach((c, i) => {
  const btn = el('button', 'cand' + (i === 0 ? ' active' : ''));
  btn.type = 'button';
  btn.appendChild(el('span', 't', c.title));
  if (c.conflict) btn.appendChild(el('span', 'chip ' + c.chipClass, c.conflict.kind));
  btn.addEventListener('click', () => show(i, btn));
  queue.appendChild(btn);
});

function show(i, btn) {
  current = i;
  document.querySelectorAll('.cand').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const c = CASES[i];
  const panel = document.getElementById('panel');
  panel.textContent = '';

  const titleCard = el('div', 'card');
  const h2 = el('h2', null, c.title);
  h2.style.margin = '0';
  titleCard.appendChild(h2);
  panel.appendChild(titleCard);

  // ① review_note(高亮最先)
  const noteCard = el('div', 'card review-note');
  noteCard.appendChild(el('h3', null, CIRC[0] + ' 候选原因(review_note)'));
  noteCard.appendChild(el('p', 'why', c.note));
  panel.appendChild(noteCard);

  // ② diff(红删绿增;新建候选基准为空)
  const diffCard = el('div', 'card');
  diffCard.appendChild(el('h3', null, CIRC[1] + ' 与当前生效版的差异'));
  const diffBox = el('div', 'diff');
  for (const [k, t] of c.diff) {
    if (k === 'h') diffBox.appendChild(el('div', 'h', t));
    else diffBox.appendChild(el('div', 'l ' + (k === 'del' ? 'del' : k === 'add' ? 'add' : ''), t));
  }
  diffCard.appendChild(diffBox);
  panel.appendChild(diffCard);

  // ③ 冲突组(显式选败方,无默认)
  let sec = 3;
  if (c.conflict) {
    const cc = el('div', 'card');
    cc.appendChild(el('h3', null, CIRC[2] + ' 冲突组裁决(' + c.conflict.kind + (c.conflict.sim ? ' · 相似度 ' + c.conflict.sim : '') + ')'));
    cc.appendChild(el('p', null, c.conflict.ask));
    const pick = el('div', 'loser-pick');
    c.conflict.parties.forEach((p) => {
      const label = el('label');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'loser-' + i;
      radio.value = p.id;
      label.appendChild(radio);
      label.appendChild(document.createTextNode(p.label));
      pick.appendChild(label);
    });
    cc.appendChild(pick);
    cc.appendChild(el('p', 'hint', '⚠️ 无默认选项 —— 不选则本轮跳过此项,下轮再次出现。'));
    panel.appendChild(cc);
    sec = 4;
  }

  // 溯源证据(折叠块,raw 原文节录)
  const sc = el('div', 'card');
  sc.appendChild(el('h3', null, CIRC[sec - 1] + ' 溯源证据'));
  if (!c.sources.length) sc.appendChild(el('p', 'hint', '(无溯源来源)'));
  c.sources.forEach((s) => {
    const d = el('details');
    d.appendChild(el('summary', null, s.ref));
    d.appendChild(el('p', 'hint', s.excerpt));
    sc.appendChild(d);
  });
  panel.appendChild(sc);

  // 该页历史决策
  const hc = el('div', 'card');
  hc.appendChild(el('h3', null, CIRC[sec] + ' 该页历史决策'));
  const ul = el('ul', 'hist');
  if (!c.hist.length) ul.appendChild(el('li', null, '(无历史决策)'));
  c.hist.forEach((h) => ul.appendChild(el('li', null, h)));
  hc.appendChild(ul);
  panel.appendChild(hc);

  // 五动作 + 理由框 + 回复文本(§4.2 格式契约)
  const ac = el('div', 'card');
  ac.appendChild(el('h3', null, '裁决动作'));
  const row = el('div', 'actions');
  const reply = el('div', 'reply-out', '(点动作生成回复文本)');
  const reason = el('textarea');
  reason.rows = 2;
  reason.placeholder = '理由(human 必填,记入 decisions.jsonl)…';
  const ACTIONS = [
    ['approve', '✓ 批准'], ['reject', '✗ 拒绝'], ['edit-then-approve', '✎ 编辑后批准'],
    ['archive-loser', '🗄 归档败方'], ['keep-both', '◫ 保留两者']
  ];
  for (const [action, label] of ACTIONS) {
    const b = el('button', null, label);
    b.type = 'button';
    b.addEventListener('click', () => {
      const c2 = CASES[current];
      if (action === 'archive-loser' && c2.conflict) {
        const sel = panel.querySelector('input[name="loser-' + current + '"]:checked');
        if (!sel) { reply.textContent = '⚠️ archive-loser 必须显式选择败方(上方冲突组单选),无默认。不选则本轮跳过此项。'; return; }
        reply.textContent = 'decision: ' + action + ' | page: ' + c2.path + ' | loser: ' + sel.value + ' | reason: ' + reason.value.replace(/\s*\n\s*/g, ' ').trim();
        return;
      }
      reply.textContent = 'decision: ' + action + ' | page: ' + c2.path + ' | reason: ' + reason.value.replace(/\s*\n\s*/g, ' ').trim();
    });
    row.appendChild(b);
  }
  const copyBtn = el('button', null, '⧉ 复制');
  copyBtn.type = 'button';
  copyBtn.addEventListener('click', () => {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(reply.textContent);
  });
  row.appendChild(copyBtn);
  ac.appendChild(row);
  ac.appendChild(reason);
  ac.appendChild(el('p', 'hint', 'HTML 只读不回写。点动作后生成回复文本,粘贴回对话即完成裁决:'));
  ac.appendChild(reply);
  panel.appendChild(ac);
}

if (CASES.length) show(0, document.querySelector('.cand'));
else document.getElementById('panel').appendChild(el('div', 'card', '本 run 无待裁决候选。'));
</script>
</body>
</html>
